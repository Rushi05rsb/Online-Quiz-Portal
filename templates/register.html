{% extends "base.html" %}

{% block title %}Create student account | Quiz Portal{% endblock %}

{% block content %}
<section class="single-auth-shell">
    <form class="auth-card register-card" method="post">
        <span class="eyebrow">STUDENT ACCESS</span>
        <h1>Create your account</h1>
        <p>Your account lets you take quizzes and view your submitted scores.</p>
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text" maxlength="100" autocomplete="name" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" maxlength="150" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="6" autocomplete="new-password" required>
        <button class="button submit-button" type="submit">Create account</button>
        <p class="auth-switch">Already registered? <a href="{{ url_for('student_login') }}">Student login</a></p>
    </form>
</section>
{% endblock %}
